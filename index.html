  <script>
  (function () {
    'use strict';
    const payload = scrapedData;
    const d = payload.result || payload;

    document.getElementById('subtitle').textContent =
      (d.domain || 'unknown') + ' · ' + (d.meta?.title || 'Tanpa judul');

    // Stats
    const s = d.stats || {};
    const statsList = [
      ['Heading', s.headings || 0],
      ['Paragraf', s.paragraphs || 0],
      ['Link', s.links || 0],
      ['Gambar', s.images || 0],
      ['Tabel', s.tables || 0],
      ['Custom', s.custom || 0]
    ];
    document.getElementById('stats').innerHTML = statsList.map(
      ([label, val]) => '<div class="stat"><b>' + val + '</b><span>' + label + '</span></div>'
    ).join('');

    // Tabs
    const tabs = [
      { id: 'meta', label: 'Meta' },
      { id: 'headings', label: 'Headings' },
      { id: 'paragraphs', label: 'Paragraf' },
      { id: 'links', label: 'Links' },
      { id: 'images', label: 'Gambar' },
      { id: 'tables', label: 'Tabel' },
      { id: 'raw', label: 'Raw Text' },
      { id: 'json', label: 'JSON' }
    ];
    const tabsEl = document.getElementById('tabs');
    tabsEl.innerHTML = tabs.map((t, i) =>
      '<button class="tab' + (i === 0 ? ' active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>'
    ).join('');

    const content = document.getElementById('content');

    function esc(v) {
      if (v === null || v === undefined) return '';
      return String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function render(tabId) {
      switch (tabId) {
        case 'meta':       content.innerHTML = renderMeta(d); break;
        case 'headings':   content.innerHTML = renderHeadings(d.headings || []); break;
        case 'paragraphs': content.innerHTML = renderParagraphs(d.paragraphs || []); break;
        case 'links':      content.innerHTML = renderLinks(d.links || []); break;
        case 'images':     content.innerHTML = renderImages(d.images || []); break;
        case 'tables':     content.innerHTML = renderTables(d.tables || []); break;
        case 'raw':        content.innerHTML = renderRaw(d.rawText || ''); break;
        case 'json':       content.innerHTML = renderJson(payload); break;
      }
    }

    function renderMeta(d) {
      const m = d.meta || {};
      const rows = [
        ['URL', d.url],
        ['Domain', d.domain],
        ['Title', d.title || m.title],
        ['Description', d.description || m.description],
        ['Author', m.author],
        ['Keywords', m.keywords],
        ['Canonical', m.canonical],
        ['OG Title', m.og && m.og.title],
        ['OG Image', m.og && m.og.image],
        ['OG Type', m.og && m.og.type],
        ['Twitter Card', m.twitter && m.twitter.card],
        ['Structured Data', (d.structuredData && d.structuredData.length) ? d.structuredData.length + ' entri' : null],
        ['Scraped At', d.scrapedAt],
        ['Engine', payload.engine],
        ['Waktu Scrape', payload.time],
        ['Proxy Dipakai', payload.proxyUsed]
      ].filter(r => r[1] !== undefined && r[1] !== null && r[1] !== '');

      return '<div class="kv">' + rows.map(r =>
        '<div class="row">' +
          '<div class="k">' + esc(r[0]) + '</div>' +
          '<div class="v">' + esc(r[1]) + '</div>' +
        '</div>'
      ).join('') + '</div>';
    }

    function renderHeadings(hs) {
      if (!hs.length) return '<div class="empty">Tidak ada heading.</div>';
      return hs.map(h =>
        '<div class="item"><span class="badge">H' + h.level + '</span>' + esc(h.text) + '</div>'
      ).join('');
    }

    function renderParagraphs(ps) {
      if (!ps.length) return '<div class="empty">Tidak ada paragraf.</div>';
      return ps.map(p => '<div class="item">' + esc(p) + '</div>').join('');
    }

    function renderLinks(ls) {
      if (!ls.length) return '<div class="empty">Tidak ada link.</div>';
      return ls.map(l =>
        '<div class="item">' +
          '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
            esc(l.text || '(tanpa teks)') +
          '</a><br>' +
          '<small style="color:var(--gray-500);word-break:break-all;font-size:11px">' + esc(l.url) + '</small>' +
        '</div>'
      ).join('');
    }

    function renderImages(ims) {
      if (!ims.length) return '<div class="empty">Tidak ada gambar.</div>';
      return ims.map(i =>
        '<div class="item">' +
          '<b>' + esc(i.alt || '(tanpa alt)') + '</b><br>' +
          '<small style="color:var(--gray-500);word-break:break-all;font-size:11px">' + esc(i.url) + '</small>' +
        '</div>'
      ).join('');
    }

    function renderTables(ts) {
      if (!ts.length) return '<div class="empty">Tidak ada tabel.</div>';
      return ts.map(t =>
        '<div class="item">' +
          '<b>Tabel #' + (t.index + 1) + '</b>' +
          (t.caption ? ' — ' + esc(t.caption) : '') +
          '<br><small>' + t.rows.length + ' baris · ' + t.headers.length + ' kolom</small>' +
        '</div>'
      ).join('');
    }

    function renderRaw(txt) {
      if (!txt) return '<div class="empty">Tidak ada raw text.</div>';
      return '<div class="section-title">Raw Text (' + txt.length + ' karakter)</div>' +
        '<div class="item" style="max-height:520px;overflow-y:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;">' +
          esc(txt) +
        '</div>';
    }

    function renderJson(obj) {
      return '<pre>' + esc(JSON.stringify(obj, null, 2)) + '</pre>';
    }

    tabsEl.addEventListener('click', function (e) {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      tabsEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.tab);
    });

    render('meta');
  })();
  </script>
