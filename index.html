<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pindown Scraped Script</title>
    <!-- Pakai Bulma CSS biar tampilan mirip aslinya -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        body { background: #f5f5f5; padding: 40px; }
        .container { max-width: 600px; }
        .alert-box { display: none; margin-bottom: 20px; }
        .alert-box.active { display: block; }
        .progress-url { display: none; margin-bottom: 20px; }
        .progress-url.active { display: block; }
        #download-section { margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title has-text-centered">Pinterest Video Downloader (Mock Test)</h1>
    <h2 class="subtitle has-text-centered">Script diekstrak dari hasil scrape, backend di-mock</h2>

    <!-- Alert Box -->
    <div class="alert-box notification is-danger is-light">
        <div id="alert"></div>
    </div>

    <!-- Progress -->
    <div class="progress-url">
        <progress class="progress is-primary" max="100">Loading...</progress>
        <p class="has-text-centered">Processing...</p>
    </div>

    <!-- FORM UTAMA (Sesuai ID yang dicari script) -->
    <form name="formurl" class="box">
        <!-- Config rahasia pindown (di-mock biar script ga error) -->
        <input type="hidden" data-challenge-config='{"retry":"Coba lagi", "invalid":"Link kosong", "invalidHtml":"Masukkan URL", "verification":"Verifikasi gagal", "seedParts":["dummy","seed"]}'>
        
        <div class="field">
            <label class="label">Pinterest Video URL</label>
            <div class="control">
                <input class="input" type="text" name="url" id="url" placeholder="https://pin.it/..." required>
            </div>
        </div>

        <div class="field">
            <div class="control">
                <button class="button is-primary is-fullwidth" type="submit" id="submitBtn">
                    Download
                </button>
            </div>
        </div>
    </form>

    <!-- HASIL DOWNLOAD -->
    <div id="download-section"></div>
</div>

<script>
    // ==========================================
    // 1. MOCK BACKEND (Bypass API Pindown)
    // ==========================================
    // Karena script asli manggil /api/token dan /action, kita bajak fetch-nya.
    
    window.requestExtraction = async function(url, formData, config) {
        // Simulasi loading 1.5 detik
        return new Promise((resolve) => {
            setTimeout(() => {
                if (url.includes("error")) {
                    resolve({ error: true, message: "Mock Error: URL tidak valid!" });
                } else {
                    resolve({
                        success: true,
                        html: `
                            <div class="box" style="border-left: 5px solid #48c774;">
                                <h3 class="title is-5">✅ Mock Extraction Success</h3>
                                <p class="mb-3">URL: <strong>${url}</strong></p>
                                <a href="https://example.com/video.mp4" class="button is-success is-small" target="_blank">
                                    Save Video (Mock)
                                </a>
                            </div>
                        `
                    });
                }
            }, 1500);
        });
    };

    // ==========================================
    // 2. SCRIPT ASLI DARI HASIL SCRAPE
    // ==========================================
    // Gua ambil logika inti dari "script.js?v=1.6" yang lu scrape.
    
    document.addEventListener("DOMContentLoaded", function(){
        var e = document.forms.namedItem("formurl"),
            t = document.querySelector(".progress-url"),
            n = document.getElementById("dlModal"),
            a = document.getElementById("closeModalBtn"),
            r = document.getElementById("ads_modal"),
            o = document.getElementById("ad-content"),
            s = document.body,
            i = document.querySelector("#alert"),
            l = document.querySelector(".alert-box");
            
        const c = document.getElementById("url"),
            d = document.getElementById("paste"),
            u = document.getElementById("clear");
            
        let f = !1, p = null, y = 0;

        function m(){ 
            if(n) n.style.display = "none"; 
            s.classList.remove("modal-open"); 
            if(r) r.innerHTML = ""; 
            if(o) o.style.minHeight = "280px"; 
        }

        window.pushAlert = function(e){
            if(t) t.classList.remove("active");
            if(l) l.classList.add("active");
            if(i) i.innerHTML = e;
        };

        window.hiddenAlert = function(){
            if(l) l.classList.remove("active");
            if(i) i.innerHTML = "";
        };

        if(e && t) {
            e.addEventListener("submit", async function(n){
                n.preventDefault();
                if(f) return;

                // Ambil config dari hidden input
                const a = JSON.parse(e.querySelector("[data-challenge-config]").value);
                a.lang = e.elements.namedItem("lang") ? e.elements.namedItem("lang").value : "en";
                
                var r = e.url.value.trim();
                if("" === r) return void pushAlert(a.invalid);

                var o = new FormData(e);
                o.set("url", r);
                y++;
                p = null;

                const s = Array.from(e.elements).map(e => [e, e.disabled]);

                function handleResponse(e) {
                    if(e.error) {
                        pushAlert(e.message || a.retry);
                    } else if(e.success && e.html) {
                        var t = document.getElementById("download-section");
                        t.innerHTML = e.html;
                    } else {
                        pushAlert(a.retry);
                    }
                }

                f = !0;
                s.forEach(([el]) => { el.disabled = !0; });
                hiddenAlert();
                t.classList.add("active");

                try {
                    // Panggil function mock yang udah kita buat di atas
                    const response = await window.requestExtraction(r, o, a);
                    handleResponse(response);
                } catch(err) {
                    pushAlert(a.retry);
                } finally {
                    t.classList.remove("active");
                    s.forEach(([el, disabled]) => { el.disabled = disabled; });
                    f = !1;
                }
            });
        }

        // Logic untuk tombol close modal
        if(a) a.onclick = function(){ m(); };
        window.onclick = function(e){ if(e.target === n) m(); };

        // Logic Accordion (FAQ)
        var w = document.querySelectorAll(".accordion .card-header");
        w.forEach(e => {
            e.addEventListener("click", function(){
                var e = this.nextElementSibling;
                if(e.classList.contains("show")){
                    e.classList.remove("show");
                    this.classList.remove("active");
                } else {
                    document.querySelectorAll(".accordion .collapse").forEach(e => e.classList.remove("show"));
                    w.forEach(e => e.classList.remove("active"));
                    e.classList.add("show");
                    this.classList.add("active");
                }
            });
        });
    });
</script>

</body>
</html>
