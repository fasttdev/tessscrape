<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pindown Scraped Script</title>
    <!-- Pakai Bulma CSS biar tampilan mirip aslinya -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        body { background: #f5f5f5; padding: 40px; }
        .container { max-width: 600px; }
        .alert-box { display: none; margin-bottom: 20px; }
        .alert-box.active { display: block; }
        .progress-url { display: none; margin-bottom: 20px; }
        .progress-url.active { display: block; }
        #download-section { margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="title has-text-centered">Pinterest Video Downloader (Mock Test)</h1>
    <h2 class="subtitle has-text-centered">Script asli hasil scrape, API di-mock</h2>

    <div class="alert-box notification is-danger is-light">
        <div id="alert"></div>
    </div>

    <div class="progress-url">
        <progress class="progress is-primary" max="100">Loading...</progress>
        <p class="has-text-centered">Processing...</p>
    </div>

    <!-- FORM UTAMA -->
    <form name="formurl" class="box">
        <!-- FIX 1: Atribut value harus ada isinya -->
        <input type="hidden" data-challenge-config='{"retry":"Coba lagi", "invalid":"Link kosong", "invalidHtml":"Masukkan URL", "verification":"Verifikasi gagal", "seedParts":["dummy","seed"]}' value='{"retry":"Coba lagi", "invalid":"Link kosong", "invalidHtml":"Masukkan URL", "verification":"Verifikasi gagal", "seedParts":["dummy","seed"]}'>
        
        <!-- FIX 2: Script butuh elemen bernama 'lang' -->
        <input type="hidden" name="lang" value="en">

        <div class="field">
            <label class="label">Pinterest Video URL</label>
            <div class="control">
                <input class="input" type="text" name="url" id="url" placeholder="https://pin.it/..." required>
            </div>
        </div>

        <div class="field">
            <div class="control">
                <button class="button is-primary is-fullwidth" type="submit">
                    Download
                </button>
            </div>
        </div>
    </form>

    <!-- Elemen Modal yang dibutuhkan script -->
    <div id="dlModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:999;">
        <div class="box" style="max-width:500px; width:90%;">
            <div id="ads_modal"></div>
            <div id="ad-content"></div>
            <button class="button is-danger mt-4" id="closeModalBtn">Close</button>
        </div>
    </div>

    <!-- HASIL DOWNLOAD -->
    <div id="download-section"></div>
</div>

<!-- 2. MOCK OVERRIDE (Biar Nggak Error 404) -->

<script>
    // Kita timpa fungsi requestExtraction aslinya pake mock ini
    window.requestExtraction = async function(url, formData, config) {
        console.log("Mock API ditembak untuk URL:", url);
        
        // Simulasi loading 1.5 detik
        await new Promise(resolve => setTimeout(resolve, 1500));
        
        if (url.includes("error")) {
            return { error: true, message: "Mock Error: URL mengandung kata 'error'" };
        }

        // Kembalikan HTML palsu seolah-olah sukses
        return {
            success: true,
            html: `
                <div class="box" style="border-left: 5px solid #48c774;">
                    <h3 class="title is-5">✅ Mock Extraction Success</h3>
                    <p class="mb-3">URL yang lu masukin: <strong>${url}</strong></p>
                    <p class="mb-3">Ini membuktikan script asli dari pindown berhasil dieksekusi dan ngirim request ke mock API.</p>
                    <a href="#" class="button is-success is-small" onclick="alert('Ini cuma tombol palsu, video aslinya nggak ada.')">
                        Save Video (Mock)
                    </a>
                </div>
            `
        };
    };
</script>
